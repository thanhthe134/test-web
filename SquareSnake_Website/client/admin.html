<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Hệ Thống — SquareSnake Việt Nam</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-stage-dark text-white">
    <header class="navbar navbar-dark border-bottom border-stage bg-stage-dark">
      <div class="container">
        <a class="navbar-brand fw-bold font-display" href="index.html">
          <span>SQUARE</span><span class="text-cyan-neon">SNAKE</span>
          <span class="small fw-normal text-stage-muted ms-2">Quản trị nội bộ</span>
        </a>
        <a href="index.html" class="btn btn-sm btn-stage-outline">Về trang khách hàng</a>
      </div>
    </header>

    <main class="container py-5">
      <div class="row g-4">
        <!-- Danh sách yêu cầu báo giá -->
        <div class="col-lg-8">
          <div class="stage-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h1 class="h4 fw-bold font-display mb-0">Danh Sách Yêu Cầu Báo Giá</h1>
              <button type="button" id="refreshContactsBtn" class="btn btn-sm btn-outline-cyan">
                Làm mới
              </button>
            </div>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                  <tr class="small text-stage-muted">
                    <th>Khách hàng</th>
                    <th>Đơn vị / SĐT</th>
                    <th>Thiết bị quan tâm</th>
                    <th>Trạng thái</th>
                  </tr>
                </thead>
                <tbody id="contactsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Form thêm thiết bị mới -->
        <div class="col-lg-4">
          <div class="stage-card p-4">
            <h2 class="h5 fw-bold font-display mb-3">Thêm Thiết Bị Mới</h2>
            <form id="addProductForm">
              <div class="mb-3">
                <label class="form-label small">Nhóm thiết bị</label>
                <select id="prodCategory" class="form-select stage-input" required>
                  <option value="1">Hệ thống Kinetic</option>
                  <option value="2">Ánh sáng Laser</option>
                  <option value="3">Màn hình LED Matrix</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label small">Tên thiết bị *</label>
                <input type="text" id="prodName" class="form-control stage-input" required />
              </div>
              <div class="mb-3">
                <label class="form-label small">Mã Model *</label>
                <input type="text" id="prodCode" class="form-control stage-input" placeholder="SS-KB400" required />
              </div>
              <div class="mb-3">
                <label class="form-label small">Mô tả ngắn</label>
                <textarea id="prodDesc" rows="2" class="form-control stage-input"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label small">Công suất / Hành trình cáp</label>
                <input type="text" id="prodPower" class="form-control stage-input" placeholder="Hành trình 12m · 24W RGBW" />
              </div>
              <div class="mb-3">
                <label class="form-label small">Chuẩn điều khiển</label>
                <input type="text" id="prodControl" class="form-control stage-input" placeholder="Art-Net / DMX512 / Madrix" />
              </div>
              <button type="submit" class="btn btn-laser-red w-100 fw-semibold">
                Lưu thiết bị vào CSDL
              </button>
            </form>
            <div id="adminProductAlert" class="alert mt-3 d-none" role="alert"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
